name: Review Plan — Agent C trigger
# Day 36 fleet · Agent C (IaC Plan Reviewer).
# A teammate comments "/review-plan" on an iac PR → this workflow runs `terraform plan`,
# renders it as TEXT (terraform show), uploads plan.txt, and POSTs to the fleet's
# /iac-plan-review endpoint. The agent downloads the plan artifact, reviews it, and posts a
# structured review as a PR comment. READ-ONLY: this workflow runs `plan` only, never apply.
#
# AUTH: reuses the SAME static AWS keys the existing iac CI uses (reusable-iac.yml) — no OIDC.
# GOTCHA: issue_comment workflows run from the file on the DEFAULT branch (main) — merge first.
# WIRING: FLEET_URL repo variable (already set for Agent B; same repo, reused here).

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: read

jobs:
  plan-and-notify:
    if: ${{ github.event.issue.pull_request && startsWith(github.event.comment.body, '/review-plan') }}
    runs-on: ubuntu-latest
    steps:
      - name: Resolve PR head ref
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REF=$(gh pr view "${{ github.event.issue.number }}" --repo "$GITHUB_REPOSITORY" \
                  --json headRefName --jq .headRefName)
          echo "ref=$REF" >> "$GITHUB_OUTPUT"

      - name: Checkout the PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.ref }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.9.8"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-1

      - name: Terraform plan → text
        working-directory: iac/dev
        run: |
          terraform init
          terraform plan -no-color -out=tfplan
          terraform show -no-color tfplan > plan.txt
          echo "----- plan.txt (first 40 lines) -----"; head -40 plan.txt

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: iac/dev/plan.txt

      - name: Notify the fleet (/iac-plan-review)
        run: |
          curl -sS -X POST "${{ vars.FLEET_URL }}/iac-plan-review" \
            -H 'Content-Type: application/json' \
            -d "$(jq -nc \
                  --arg repo "${{ github.repository }}" \
                  --argjson pr ${{ github.event.issue.number }} \
                  --arg run "${{ github.run_id }}" \
                  '{repo:$repo, pr_number:$pr, run_id:$run, plan_path:null}')"
