name: PR Open — App CI

# Thin caller (<35 lines): frontend PR to main -> the platform's reusable Node CI gate.
# The job is named `app-ci` so the required check resolves to `app-ci / ci-success`
# (identical name across all 5 services => one ruleset line covers them all — IRD-015).
# @v6 Node gate: build + sonar + gitleaks + trivy fs + image build (push:false) + trivy image.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths-ignore:
      - 'iac/**'
      - '**/Jenkinsfile'

jobs:
  app-ci:
    uses: proops-task-management/cicd-platform/.github/workflows/reusable-node-ci.yml@v6
    with:
      runtime-version: "20"
      image-tag: ${{ github.sha }}
      push-image: false
      enable-sonar: true
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
