# Dependabot standard (IRD-015): npm + docker + github-actions, weekly,
# minor/patch grouped into one PR; majors come individually; security updates always on.
# npm exception (MIN-39): coupled toolchain ecosystems are grouped across ALL update-types
# (incl. majors) so a generation bump arrives as ONE peer-consistent PR — a single package
# dragged forward alone fails `npm ci` with ERESOLVE (the root cause of this ticket).
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      # Coupled majors — one PR per ecosystem (order matters: matched before all-minor-patch).
      eslint:
        patterns:
          - "eslint"
          - "@eslint/*"
          - "typescript-eslint"
          - "eslint-plugin-*"
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      vite:
        patterns:
          - "vite"
          - "@vitejs/*"
          - "vitest"
          - "@vitest/*"
      tailwind:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"
      all-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # Keep the builder on the Node 24 LTS line — the same major as `runtime-version: "24"` in
      # pr-opened.yml + pr-merged.yml (MIN-66). Dependabot can bump this Dockerfile but never the
      # workflow input, so a Dependabot major PR would split CI and Docker onto different majors.
      # Block >=25, keep 24.x patches. This ignore hides the upgrade signal, so the next LTS move
      # (all three pins in one PR) is owned by MIN-67 on the board, not by this comment.
      # (The nginx runtime is a low-risk static server — not pinned.)
      - dependency-name: "node"
        versions: [">=25"]
    groups:
      all-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      all-minor-patch:
        update-types: ["minor", "patch"]
