# Dependabot standard (IRD-015): npm + docker + github-actions, weekly,
# minor/patch grouped into one PR; majors come individually; security updates always on.
# npm exception (MIN-39): coupled toolchain ecosystems are grouped across ALL update-types
# (incl. majors) so a generation bump arrives as ONE peer-consistent PR — a single package
# dragged forward alone fails `npm ci` with ERESOLVE (the root cause of this ticket).
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      # Coupled majors — one PR per ecosystem (order matters: matched before all-minor-patch).
      eslint:
        patterns:
          - "eslint"
          - "@eslint/*"
          - "typescript-eslint"
          - "eslint-plugin-*"
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      vite:
        patterns:
          - "vite"
          - "@vitejs/*"
          - "vitest"
          - "@vitest/*"
      tailwind:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"
      all-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # Keep the builder on the Node 20 line (matches the app's runtime-version: "20").
      # A major Node bump in the builder can break `npm ci` / `npm run build`; the shift-left
      # image gate would now catch it at PR, but pinning avoids the weekly red PR. Block >=21,
      # keep 20.x patches. (The nginx runtime is a low-risk static server — not pinned.)
      - dependency-name: "node"
        versions: [">=21"]
    groups:
      all-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      all-minor-patch:
        update-types: ["minor", "patch"]
